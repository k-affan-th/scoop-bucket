name: Excavator

on:
  workflow_dispatch:
  schedule:
    - cron: '20 */4 * * *'

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout bucket
        uses: actions/checkout@v4
      - name: Check for new versions
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
